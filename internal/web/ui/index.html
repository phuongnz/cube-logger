<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing is loaded from anywhere. The tool is local-only and sends nothing
     out, and a UI that fetched a font from a CDN would quietly break that. -->
<title>cube-logger</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>

<header id="bar">
  <span id="brand">cube-logger</span>
  <span id="conn" class="pill" title="connection to the local server">connecting</span>

  <input id="filter" type="search" placeholder="filter text — number, Call-ID, header, anything"
         autocomplete="off" spellcheck="false">

  <select id="severity" title="keep this severity and everything more urgent">
    <option value="-1">all severities</option>
    <option value="3">error and worse</option>
    <option value="4">warning and worse</option>
    <option value="5">notice and worse</option>
    <option value="6">informational and worse</option>
    <option value="7">debug and worse</option>
  </select>

  <select id="kind" title="record type">
    <option value="">all types</option>
    <option value="sip">SIP messages</option>
    <option value="debug">debug</option>
    <option value="log">% log lines</option>
    <option value="other">other</option>
  </select>

  <select id="source" title="device"><option value="">all devices</option></select>

  <label class="check" title="only records with lines missing">
    <input id="incomplete" type="checkbox"> incomplete
  </label>

  <button id="calls-toggle" class="on" title="show the call list (C)">Calls</button>
  <button id="pause" title="stop adding new records to the table (Space)">Pause</button>
  <button id="follow" class="on" title="scroll to keep the newest record in view">Follow</button>
  <button id="clear" title="empty the table in this browser">Clear</button>
  <button id="open" title="open a saved log, a &quot;show logging&quot; capture or a session file (O)">Open…</button>
  <button id="save" title="save every record held here as a session file">Save</button>
  <input id="openfile" type="file" hidden>
  <span id="count" class="muted"></span>
  <span id="notice" class="muted"></span>
</header>

<main>
  <aside id="calls">
    <div id="calls-head">
      <strong>calls</strong>
      <label class="check" title="show the OPTIONS keepalives every dial-peer sends">
        <input id="calls-keepalives" type="checkbox"> keepalives
      </label>
      <span id="calls-count" class="muted"></span>
    </div>
    <div id="calls-list" role="list"></div>
    <p id="calls-empty" class="empty">No calls yet.</p>
  </aside>

  <div id="centre">
  <section id="ladder" hidden>
    <div id="ladder-head">
      <strong id="ladder-title">call</strong>
      <span id="ladder-sub" class="muted"></span>
      <span class="spacer"></span>
      <button id="call-copy" title="copy this call's messages to the clipboard">Copy</button>
      <button id="call-download" title="save this call's messages as a text file">Download</button>
      <button id="call-close" title="show every record again (Esc)">&times;</button>
    </div>
    <div id="ladder-body"></div>
    <!-- The SVG namespace has to be named to create an SVG element from
         script, and it is a URL. It is taken from this element rather than
         written as a literal, so that "does this page reference anything on
         the network?" stays a question one grep answers. -->
    <svg id="ns" width="0" height="0" aria-hidden="true"></svg>
  </section>

    <div id="table">
      <div id="head" class="row head">
        <span class="c-time">time</span>
        <span class="c-src">source</span>
        <span class="c-sev">sev</span>
        <span class="c-kind">type</span>
        <span class="c-call">call</span>
        <span class="c-msg">message</span>
      </div>
      <!-- The viewport scrolls; #spacer is as tall as every row would be, and
           only the visible slice is ever in the DOM. That is what keeps 100k+
           records smooth. -->
      <div id="viewport">
        <div id="spacer"></div>
        <div id="rows"></div>
        <div id="empty" class="empty">
          <p>Nothing yet.</p>
          <p class="muted" id="empty-hint">Waiting for syslog. On the CUBE you need
          <code>logging host &lt;this machine&gt; transport udp port 5514</code>,
          <code>logging trap debugging</code> and <code>service sequence-numbers</code>.</p>
        </div>
      </div>
    </div>
  </div>

  <aside id="detail" hidden>
    <div id="detail-head">
      <strong id="detail-title">record</strong>
      <button id="detail-close" title="close (Esc)">&times;</button>
    </div>
    <div id="detail-meta"></div>
    <pre id="detail-raw"></pre>
  </aside>
</main>

<footer id="status">
  <span id="status-store" class="muted"></span>
  <span id="status-sources"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
